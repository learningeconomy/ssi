[package]
name = "ssi-json-ld"
version = "0.2.2"
edition = "2021"
authors = ["Spruce Systems, Inc."]
license = "Apache-2.0"
description = "Implementation of JSON-LD algorithms for the ssi library."
repository = "https://github.com/spruceid/ssi/"
documentation = "https://docs.rs/ssi-json-ld/"

[features]
## Leave the schema.org (~200 KB) and W3C CCG traceability (~123 KB) contexts
## out of the static loader, so they aren't linked into the binary. Lookups for
## those IRIs then fall through to the caller's context map. Meant for size-bound
## builds like didkit-wasm. It's a subtractive feature: anything else built in
## the same cargo invocation loses the two contexts too.
omit-large-contexts = []

[dependencies]
thiserror = "1.0"
async-std = { version = "1.9", features = ["attributes"] }
json-ld = "0.12.1"
iref = "^2.0.3"
static-iref = "2"
rdf-types = "0.12.15"
locspan = "0.7.13"
json-syntax = "0.9"
futures = "0.3"
serde_json = "1.0.95"
lazy_static = "1.4"
grdf = "0.16.2"
ssi-contexts = { version = "0.1.5", path = "../contexts/" }
ssi-crypto = { path = "../ssi-crypto", version = "0.1" }

[dev-dependencies]
difference = "2.0"
nquads-syntax = "0.10.0"
tokio = { version = "1.27.0", features = ["rt", "macros"] }
# `to_value_with` lives behind json-syntax's `serde` feature. Enabled for tests only so the
# feature is not forced on downstream builds.
json-syntax = { version = "0.9", features = ["serde"] }
